// Acima deste tamanho, um único pedido seria demasiado grande para
// analisar com fiabilidade — a análise passa automaticamente a
// dividir o documento em partes (ver ANALISE_CHUNK_SIZE mais abaixo).
const ANALISE_CHUNK_SIZE = 120000; // caracteres por parte
const ANALISE_MAX_PARTES = 12; // ~1,44M caracteres no total — cobre praticamente qualquer OGE
const ABSOLUTO_MAX = ANALISE_CHUNK_SIZE * ANALISE_MAX_PARTES;

// Divide o texto em partes de tamanho-alvo, tentando cortar em
// quebras de parágrafo (não a meio de uma frase ou tabela) sempre
// que a quebra estiver razoavelmente perto do alvo.
function dividirEmPartes(texto, tamanhoAlvo) {
    const partes = [];
    let pos = 0;
    while (pos < texto.length) {
        let fim = Math.min(pos + tamanhoAlvo, texto.length);
        if (fim < texto.length) {
            const quebra = texto.lastIndexOf("\n\n", fim);
            if (quebra > pos + tamanhoAlvo * 0.5) fim = quebra;
        }
        partes.push(texto.slice(pos, fim));
        pos = fim;
    }
    return partes;
}

const EXTRACTION_SYSTEM = `Você prepara extratos de uma parte de um documento orçamental extenso, para uma análise posterior de Orçamento Sensível ao Género (BSG). Este é o excerto {N} de um documento maior. Leia o texto e extraia, em português, apenas o que for relevante para avaliar: (1) declarações/notas orçamentais de género, (2) documentação orçamental que mencione género, (3) classificação ou natureza de linhas/projetos orçamentais, (4) dados de execução/desempenho desagregados por sexo, (5) avaliação de impacto ou exame legislativo sobre género. Inclua também até 8 linhas orçamentais ou projetos com montante, se existirem neste excerto. Seja factual e conciso — não invente informação que não esteja no texto, e não repita o texto integralmente. Se este excerto não tiver nada relevante, devolva notas vazias. Responda APENAS com JSON válido, sem markdown: {"notas": "<até 250 palavras>", "linhas": [{"nome": "...", "montante": "...", "observacao": "..."}]}`;

async function chamarWorker(system, userContent, maxTokens) {
    const response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            system,
            messages: [{ role: "user", content: userContent }],
            max_tokens: maxTokens,
        }),
    });
    const data = await response.json();
    if (!response.ok) {
        throw new Error((data && data.error && data.error.message) || `Erro da API (código ${response.status}).`);
    }
    const text = (data.content || []).map((b) => b.text || "").join("");
    if (!text.trim())
        throw new Error("A resposta veio vazia.");
    return text;
}
