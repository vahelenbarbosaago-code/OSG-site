const ANALISE_MAX_PARTES = 12;
const ABSOLUTO_MAX = ANALISE_CHUNK_SIZE * ANALISE_MAX_PARTES;

function dividirEmPartes(texto, tamanhoAlvo) {
    const partes = [];
    let pos = 0;
    while (pos < texto.length) {
        let fim = Math.min(pos + tamanhoAlvo, texto.length);
        if (fim < texto.length) {
            const quebra = texto.lastIndexOf("\n\n", fim);
            if (quebra > pos + tamanhoAlvo * 0.5) fim = quebra;
        }
        partes.push(texto.slice(pos, fim));
        pos = fim;
    }
    return partes;
}

// Extração intermédia: mantida sempre em português como "idioma de trabalho"
// interno — só a síntese final é traduzida para o idioma escolhido pelo
// utilizador, para evitar perdas de nuance em traduções encadeadas.
const EXTRACTION_SYSTEM = `Você prepara extratos de uma parte de um documento orçamental extenso, para uma análise posterior de Orçamento Sensível ao Género (OSG). Este é o excerto {N} de um documento maior. Leia o texto e extraia, em português, apenas o que for relevante para avaliar: (1) declarações/notas orçamentais de género, (2) documentação orçamental que mencione género, (3) classificação ou natureza de linhas/projetos orçamentais, (4) dados de execução/desempenho desagregados por sexo, (5) avaliação de impacto ou exame legislativo sobre género. Inclua também até 8 linhas orçamentais ou projetos com montante, se existirem neste excerto. Preserve detalhes concretos e citáveis tal como aparecem no texto — números exatos, nomes de documentos ou instrumentos, datas, artigos de lei, nomes de projetos — em vez de resumir de forma vaga; a análise final depende destes detalhes precisos para se fundamentar corretamente. Seja factual — nunca invente informação, números ou nomes que não estejam literalmente no texto — e conciso, sem repetir o texto integralmente. Se este excerto não tiver nada relevante, devolva notas vazias em vez de forçar uma interpretação. Responda APENAS com JSON válido, sem markdown: {"notas": "<até 250 palavras, com detalhes concretos preservados>", "linhas": [{"nome": "...", "montante": "...", "observacao": "..."}]}`;

async function chamarAPI(payload) {
    const response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    });
    let data;
    try { data = await response.json(); } catch { data = {}; }
    if (!response.ok) {
        // O campo "error" pode vir como texto simples (erros do próprio
        // Worker) ou como objeto {message: "..."} quando o Worker devolve
        // diretamente a resposta de erro da API da Anthropic — sem isto,
        // "new Error(objeto)" produzia a mensagem inútil "[object Object]".
        let mensagem;
        if (typeof data?.error === "string") mensagem = data.error;
        else if (data?.error?.message) mensagem = data.error.message;
        else mensagem = `Erro da API (código ${response.status}).`;
        const err = new Error(mensagem);
        err.status = response.status;
        throw err;
    }
    return data;
}
async function chamarWorker(system, userContent, maxTokens, accessCode) {
    const data = await chamarAPI({ system, messages: [{ role: "user", content: userContent }], max_tokens: maxTokens, accessCode });
    const text = (data.content || []).map((b) => b.text || "").join("");
    if (!text.trim()) throw new Error("A resposta veio vazia.");
    return text;
}
async function validarCodigo(accessCode) {
    return chamarAPI({ action: "validate_code", accessCode });
}
async function listarHistorico(accessCode) {
    const data = await chamarAPI({ action: "list_history", accessCode });
    return data.history || [];
}
async function guardarHistorico(accessCode, entry) {
    try { await chamarAPI({ action: "save_history", accessCode, entry }); return true; } catch { return false; }
}
async function apagarHistoricoEntrada(accessCode, item) {
    return chamarAPI({ action: "delete_history", accessCode, entry: { savedAt: item.savedAt } });
}
async function listarCodigosAdmin(accessCode) {
    const data = await chamarAPI({ action: "admin_list_codes", accessCode });
    return data.codes || [];
}
async function verHistoricoAdmin(accessCode, targetCode) {
    const data = await chamarAPI({ action: "admin_view_history", accessCode, targetCode });
    return data.history || [];
}
async function compararCodigos(accessCode, targetCodes) {
    const data = await chamarAPI({ action: "admin_compare_codes", accessCode, targetCodes });
    return data.comparisons || [];
}

// Codificação segura em UTF-8 para embutir o resultado da análise no
// próprio URL (link partilhável, sem depender de sessão/backend) e
// descodificação inversa ao abrir esse link.
function codificarPartilha(obj) {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function descodificarPartilha(str) {
    const base64 = str.replace(/-/g, "+").replace(/_/g, "/");
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
}

function parseAnalysisJson(text) {
    const clean = text.replace(/```json|```/g, "").trim();
    try { return JSON.parse(clean); }
    catch {
        const start = clean.indexOf("{"); const end = clean.lastIndexOf("}");
        if (start !== -1 && end !== -1 && end > start) return JSON.parse(clean.slice(start, end + 1));
        throw new Error("invalid_format");
    }
}

function validateResult(parsed, s) {
    if (!parsed || typeof parsed !== "object") throw new Error(s.errIncompleteGeneral);
    if (typeof parsed.overallScore !== "number" || typeof parsed.overallLevel !== "string") throw new Error(s.errIncompleteScore);
    if (!Array.isArray(parsed.modules) || parsed.modules.length === 0) throw new Error(s.errIncompleteModules);
    const validKeys = new Set(MODULE_KEYS);
    const validConfidence = new Set(["alta", "media", "baixa"]);
    for (const m of parsed.modules) {
        if (!validKeys.has(m.key) || typeof m.score !== "number" || m.score < 0 || m.score > 4) throw new Error(s.errInvalidModule);
        if (m.confidence && !validConfidence.has(m.confidence)) m.confidence = null;
    }
    if (parsed.lineItems && !Array.isArray(parsed.lineItems)) throw new Error(s.errInvalidLineItems);
}

function validateFullReport(parsed) {
    if (!parsed || typeof parsed !== "object") throw new Error("invalid_report");
    if (typeof parsed.executiveSummary !== "string" || typeof parsed.methodology !== "string") throw new Error("invalid_report");
    if (!Array.isArray(parsed.dimensionAnalysis) || parsed.dimensionAnalysis.length === 0) throw new Error("invalid_report");
    if (typeof parsed.sectorAnalysis !== "string") throw new Error("invalid_report");
    if (!Array.isArray(parsed.recommendations)) throw new Error("invalid_report");
    if (!Array.isArray(parsed.annexEvidence)) throw new Error("invalid_report");
    if (typeof parsed.internationalBenchmark !== "string") parsed.internationalBenchmark = "";
    if (!parsed.roadmap || typeof parsed.roadmap !== "object") parsed.roadmap = { shortTerm: [], mediumTerm: [], longTerm: [] };
    ["shortTerm", "mediumTerm", "longTerm"].forEach((k) => { if (!Array.isArray(parsed.roadmap[k])) parsed.roadmap[k] = []; });
    if (!Array.isArray(parsed.organizationActions)) parsed.organizationActions = [];
}

// Contagem determinística dos marcadores G0/G1/G2 por linha orçamental —
// calculada em JS a partir do resultado, nunca pedida à IA, para que a
// percentagem apresentada seja sempre exata e não sujeita a alucinação.
function computeMarkerTally(lineItems) {
    const tally = { G0: 0, G1: 0, G2: 0, G3: 0 };
    (lineItems || []).forEach((li) => { if (tally[li.marker] !== undefined) tally[li.marker]++; });
    const total = tally.G0 + tally.G1 + tally.G2 + tally.G3;
    const pct = (n) => (total > 0 ? Math.round((n / total) * 100) : 0);
    const g1g2g3 = tally.G1 + tally.G2 + tally.G3;
    return { ...tally, total, pctG0: pct(tally.G0), pctG1: pct(tally.G1), pctG2: pct(tally.G2), pctG3: pct(tally.G3), pctG1G2G3: pct(g1g2g3) };
}

function resultToPlainText(result, lang, s) {
    const mods = MODULES_I18N[lang]; const levels = LEVEL_LABELS_I18N[lang];
    const lines = [];
    lines.push(`${s.overallLevelLabel}: ${result.overallLevel} (${result.overallScore}/4)`);
    lines.push(result.summary || ""); lines.push("");
    mods.forEach((mod) => {
        const m = result.modules.find((r) => r.key === mod.key);
        if (!m) return;
        lines.push(`${mod.label} — ${levels[m.score]}`);
        lines.push(`  ${m.finding}`);
        if (m.evidence) lines.push(`  [${s.evidenceLabel}: ${m.evidence}]`);
        lines.push(`  → ${m.recommendation}`); lines.push("");
    });
    if (result.lineItems && result.lineItems.length > 0) {
        lines.push(s.lineItemsLabel + ":");
        result.lineItems.forEach((li) => lines.push(`  [${li.marker}] ${li.name} — ${li.comment}`));
    }
    return lines.join("\n");
}

// Ordena o histórico do mais antigo para o mais recente, ignorando entradas
// sem data ou sem resultado válido — necessário para desenhar uma tendência
// com sentido temporal correto.
function ordenarHistoricoCronologico(history) {
    return (history || [])
        .filter((item) => item && item.result && typeof item.result.overallScore === "number")
        .slice()
        .sort((a, b) => new Date(a.savedAt || 0) - new Date(b.savedAt || 0));
}

// Pequeno gráfico de linha em SVG puro (sem dependências externas) para
// mostrar a evolução do nível geral ao longo de sucessivas análises.
function TrendLineChart({ points, max = 4, height = 120 }) {
    if (!points || points.length < 2) return null;
    const width = 100; // percentagem, escala via viewBox
    const stepX = width / (points.length - 1);
    const coords = points.map((p, i) => {
        const x = i * stepX;
        const y = height - (p / max) * height;
        return `${x},${y}`;
    });
    const path = "M" + coords.join(" L");
    return (React.createElement("svg", { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: "none", className: "w-full", style: { height: height + "px" } },
        [0, 1, 2, 3, 4].map((i) => (React.createElement("line", { key: i, x1: 0, x2: width, y1: height - (i / max) * height, y2: height - (i / max) * height, stroke: "#EDE8DC", strokeWidth: "0.5" }))),
        React.createElement("path", { d: path, fill: "none", stroke: "#1F5D5B", strokeWidth: "1.5", vectorEffect: "non-scaling-stroke" }),
        points.map((p, i) => (React.createElement("circle", { key: i, cx: i * stepX, cy: height - (p / max) * height, r: "1.6", fill: "#C9A227" })))));
}

    async function extrairTextoPdf(arrayBuffer) {
        if (typeof pdfjsLib !== "undefined" && pdfjsLib.GlobalWorkerOptions) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js";
        }
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let texto = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            texto += content.items.map((it) => it.str).join(" ") + "\n\n";
        }
        return texto.trim();
    }
    function extrairTextoExcel(arrayBuffer) {
        const wb = XLSX.read(arrayBuffer, { type: "array" });
        return wb.SheetNames.map((nome) => `--- ${nome} ---\n${XLSX.utils.sheet_to_csv(wb.Sheets[nome])}`).join("\n\n");
    }
    const TAMANHO_MAX_FICHEIRO = 30 * 1024 * 1024;
    async function lidarComFicheiro(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setErroFicheiro("");
        if (file.size > TAMANHO_MAX_FICHEIRO) {
            setErroFicheiro(s.fileTooLarge((file.size / 1024 / 1024).toFixed(1)));
            return;
        }
        setExtraindo(true); setFicheiroNome(file.name);
        try {
            const ext = file.name.split(".").pop().toLowerCase();
            let texto = "";
            if (ext === "txt" || ext === "csv") texto = await file.text();
            else if (ext === "pdf") texto = await extrairTextoPdf(await file.arrayBuffer());
            else if (ext === "xlsx" || ext === "xls") texto = extrairTextoExcel(await file.arrayBuffer());
            else throw new Error(s.fileUnsupported);
            if (!texto.trim()) throw new Error(s.fileEmpty);
            if (texto.length > ABSOLUTO_MAX) {
                setErroFicheiro(s.fileTooLong(texto.length.toLocaleString(), ABSOLUTO_MAX.toLocaleString()));
                setInput(texto.slice(0, ABSOLUTO_MAX));
            } else {
                setInput(texto);
            }
        } catch (err) {
            setErroFicheiro(err && err.message ? err.message : s.fileReadError);
            setFicheiroNome("");
        } finally {
            setExtraindo(false); e.target.value = "";
        }
    }

    function baixarPdf(result) {
        if (typeof jspdf === "undefined") return;
        const { jsPDF } = jspdf;
        const doc = new jsPDF({ unit: "pt", format: "a4" });
        const margem = 48;
        let y = margem;
        const largura = doc.internal.pageSize.getWidth() - margem * 2;

        function novaLinha(altura) {
            y += altura;
            if (y > doc.internal.pageSize.getHeight() - margem) { doc.addPage(); y = margem; }
        }
        function texto(txt, opts = {}) {
            const tamanho = opts.size || 10;
            const negrito = opts.bold ? "bold" : "normal";
            doc.setFont("helvetica", negrito);
            doc.setFontSize(tamanho);
            if (opts.color) doc.setTextColor(...opts.color); else doc.setTextColor(20, 30, 30);
            const linhas = doc.splitTextToSize(txt, largura);
            linhas.forEach((l) => {
                doc.text(l, margem, y);
                novaLinha((tamanho * 1.3));
            });
        }

        doc.setFillColor(22, 48, 46);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 90, "F");
        doc.setTextColor(246, 243, 237);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("Analisador OSG", margem, 40);
        doc.setFontSize(11);
        doc.setFont("helvetica", "normal");
        doc.text(`${s.overallLevelLabel}: ${result.overallLevel}  (${result.overallScore}/4)`, margem, 62);
        y = 118;
        texto(result.summary || "", { size: 11, color: [62, 76, 73] });
        novaLinha(8);

        mods.forEach((mod) => {
            const m = result.modules.find((r) => r.key === mod.key);
            if (!m) return;
            texto(`${mod.label} — ${levels[m.score]}`, { bold: true, size: 11, color: [31, 93, 91] });
            texto(m.finding, { size: 10 });
            if (m.evidence) texto(`${s.evidenceLabel}: ${m.evidence}`, { size: 9, color: [122, 143, 140] });
            texto("→ " + m.recommendation, { size: 10, color: [31, 93, 91] });
            novaLinha(6);
        });

        if (result.lineItems && result.lineItems.length > 0) {
            novaLinha(4);
            texto(s.lineItemsLabel, { bold: true, size: 12 });
            const tallyPdf = computeMarkerTally(result.lineItems);
            texto(`${s.tallyLabel}: G0 ${tallyPdf.G0} (${tallyPdf.pctG0}%) · G1 ${tallyPdf.G1} (${tallyPdf.pctG1}%) · G2 ${tallyPdf.G2} (${tallyPdf.pctG2}%) · G3 ${tallyPdf.G3} (${tallyPdf.pctG3}%)`, { size: 9, color: [122, 143, 140] });
            result.lineItems.forEach((li) => {
                texto(`[${li.marker}] ${li.name} — ${li.comment}`, { size: 9 });
            });
        }

        doc.save(`analise-osg-${lang}.pdf`);
    }

    function buildSystemPrompt() {
        const modLines = mods.map((m, i) => `${i + 1}. ${m.label}: ${m.desc}`).join("\n");
        const keysList = MODULE_KEYS.join(", ");
        return `Você é um avaliador técnico internacional de Orçamento Sensível ao Género (OSG / Gender-Responsive Budgeting). A sua avaliação de referência universal segue as Boas Práticas de Orçamentação de Género da OCDE (OECD Best Practices for Gender Budgeting, 2023), o módulo suplementar de Gestão das Finanças Públicas Sensíveis ao Género do PEFA (GRPFM, reforma 2020) e o indicador ODS 5.c.1 da ONU. Esta base é aplicável a qualquer país, independentemente da sua região ou nível de rendimento.

IMPORTANTE — Reconhecimento regional e nacional automático: identifique no texto do utilizador o país, região, bloco económico ou organização em causa e, sempre que reconhecer um enquadramento específico aplicável, cite-o explicitamente nas suas conclusões, além da base universal. Enquadramentos a reconhecer: UEMOA/CEDEAO/ECOWAS, SADC, União Africana, União Europeia, Conselho da Europa, Commonwealth, países nórdicos, ASEAN, CARICOM, Liga Árabe, CEPAL/ECLAC, Índia (Gender Budgeting), Filipinas (GAD Budget), Ruanda, México (Anexo Transversal), Marrocos (Rapport Genre), UN Women, Banco Mundial, FMI. Qualquer outro país ou organização sem enquadramento específico conhecido: aplique apenas a base universal, sem inventar um enquadramento que não existe. Se não tiver confiança suficiente, prefira citar só a base universal a inventar uma norma nacional incorreta.

REGRA DE FUNDAMENTAÇÃO (obrigatória, a mais importante desta tarefa): cada pontuação e cada "finding" têm de assentar exclusivamente em informação que está literalmente presente no texto fornecido pelo utilizador. Nunca invente factos, números, nomes de documentos, datas ou instrumentos que não tenha visto no texto. Se o texto não mencionar nada sobre uma dimensão específica, isso significa pontuação 0 nessa dimensão e o "finding" deve dizer explicitamente que não há menção no texto — não infira boa prática a partir do silêncio, e não presuma que "provavelmente existe" algo só porque seria comum nesse tipo de país ou organização. É preferível uma pontuação baixa e honesta do que uma pontuação otimista sem base no texto.

Para cada dimensão, o campo "evidence" deve conter uma referência curta e direta ao ponto exato do texto do utilizador que justifica a pontuação (uma paráfrase muito próxima do texto original, não uma citação literal longa) — ou, se não houver evidência no texto para essa dimensão, "evidence" deve dizer isso explicitamente (ex.: "Não mencionado no texto fornecido").

Para a Dimensão 1, avalie se existe uma declaração orçamental de género estruturada: (i) análise da situação, (ii) efeitos/objetivos, (iii) atividades, (iv) indicadores desagregados por sexo, (v) orçamento associado.

PARTE A — Avalie o orçamento segundo estas 5 dimensões, cada uma pontuada de 0 a 4:
0 = Não iniciado: nenhuma evidência da prática no texto.
1 = Emergente: menções pontuais/isoladas no texto, sem instrumento formal.
2 = Em desenvolvimento: o texto descreve um instrumento formal mas parcial (não cobre todos os ministérios/programas).
3 = Avançado: o texto mostra aplicação consistente à maioria dos programas, com dados, mas falta base legal permanente ou avaliação de impacto.
4 = Exemplar: o texto confirma prática consagrada em lei, aplicada universalmente, com dados desagregados, avaliação de impacto e prestação de contas pública.
Regra: um instrumento formal mas parcial (segundo o texto) nunca deve passar de 2 — reserve 3 e 4 apenas quando o texto demonstrar cobertura efetivamente ampla ou universal, não intenção ou desenho de processo.

Dimensões:
${modLines}

PARTE B — Marcador de Género por linha orçamental (até 6 linhas/projetos), segundo a escala G0/G1/G2 da OCDE-CAD (adotada pela União Europeia e pelo modelo Pro PALOP-TL ISC/UEMOA). Aplique os CRITÉRIOS MÍNIMOS do Handbook OCDE-DAC (2016) — não atribua G1 ou G2 apenas porque o nome do projeto soa a género; exija evidência textual de cada critério:

G0 — Não visa a igualdade de género: nenhum objetivo, atividade ou indicador de género identificável no texto para esta linha/projeto. Esta é a atribuição por defeito sempre que os critérios de G1 não estiverem cumpridos.

G1 — Componente de género (objetivo significativo, mas não principal). CRITÉRIO MÍNIMO (têm de estar AMBOS presentes no texto, não apenas um): (i) pelo menos um objetivo de género explícito ou implícito claro (ex.: "reforçar capacidades de mulheres", "reduzir uma disparidade de género específica"); E (ii) pelo menos um indicador ou meta associável a esse objetivo (mesmo que não totalmente desagregado por sexo). A igualdade de género não é o objetivo principal da linha/projeto. Uma menção vaga a "mulheres e jovens" sem objetivo nem indicador associado NÃO é suficiente para G1 — mantenha G0 nesse caso.

G2 — Promoção direta da igualdade de género (objetivo principal). CRITÉRIO MÍNIMO: a igualdade de género ou o empoderamento de mulheres/raparigas é, segundo o texto, o objetivo principal e explícito da linha/projeto (não um efeito secundário), e o financiamento da linha é predominantemente dedicado a esse fim (ex.: nome do projeto e descrição centram-se em género; "eliminação da MGF", "empoderamento económico das mulheres").

G3 — Prevenção e resposta à violência baseada no género (VBG): subcategoria de G2 usada quando o objetivo principal e explícito da linha/projeto é especificamente prevenir ou responder a violência baseada no género (ex.: combate ao tráfico de mulheres e crianças, apoio a vítimas de violência doméstica, eliminação de mutilação genital feminina, unidades de atendimento a vítimas). Use G3 em vez de G2 sempre que o foco VBG for explícito no texto; caso contrário, mantenha G2 para outros objetivos principais de género.

Regra de desempate: se não tiver a certeza entre G0 e G1, ou entre G1 e G2, escolha sempre o nível mais baixo (mais conservador) e explique a incerteza no "comment" — nunca "arredonde para cima" com base em suposições sobre o que o projeto provavelmente inclui. Baseie-se apenas em linhas/projetos efetivamente mencionados no texto — não invente linhas orçamentais. Se o texto não detalhar linhas suficientes, devolva array vazio.

Regra para recomendações: cada "recommendation" deve ser o passo seguinte, concreto e realista, para subir exatamente 1 nível na escada acima a partir do que o texto mostra — não o estado ideal final, e não uma recomendação genérica desligada do que foi descrito.

AUTOVERIFICAÇÃO (faça isto mentalmente antes de responder, não inclua na resposta): releia cada uma das 5 pontuações que atribuiu e confirme que (a) corresponde exatamente à âncora de maturidade 0-4 descrita acima, (b) tem uma frase do "evidence" que a sustenta diretamente, e (c) não é mais generosa do que o texto permite. Releia também cada marcador G0/G1/G2 atribuído na Parte B e confirme que cumpre os critérios mínimos exigidos (não apenas o nome do projeto) — desça o nível se a evidência for insuficiente. Corrija qualquer pontuação ou marcador que não passe neste teste antes de produzir o JSON final.

Responda APENAS com um JSON válido, sem markdown, neste formato exato:
{"overallScore": <média das 5 pontuações, 1 casa decimal>, "overallLevel": "<nível geral>", "summary": "<1 frase curta, máx 25 palavras>", "modules": [{"key": "<key>", "score": <0-4>, "finding": "<1 frase, máx 20 palavras>", "evidence": "<referência curta ao texto original, máx 20 palavras, ou \\"Não mencionado no texto fornecido\\">", "recommendation": "<1 frase acionável, máx 20 palavras>"}], "lineItems": [{"name": "<nome curto>", "marker": "<G0|G1|G2|G3>", "comment": "<1 frase, máx 15 palavras>"}]}

Use as keys exatas: ${keysList}. Seja direto e crítico — não seja excessivamente elogioso se a informação for vaga ou insuficiente, e nunca prefira uma resposta "simpática" a uma resposta fiel ao que o texto realmente mostra.

IMPORTANTE SOBRE O IDIOMA: toda a resposta — summary, finding, evidence, recommendation, comment, e overallLevel — deve ser escrita inteiramente em ${LANG_NAMES_PT[lang]}, incluindo terminologia técnica traduzida adequadamente. Mantenha as keys JSON exatamente como especificado (não traduza as keys), apenas os valores de texto devem estar em ${LANG_NAMES_PT[lang]}.`;
    }

    function buildReviewSystemPrompt(draftResult, originalInput) {

        return `Você é um segundo avaliador técnico, independente do primeiro, a fazer o CONTROLO DE QUALIDADE de uma análise de Orçamento Sensível ao Género (OSG) já produzida. O seu trabalho não é refazer a análise do zero — é revê-la com espírito crítico, corrigir qualquer pontuação que não esteja bem fundamentada no texto original, e atribuir um nível de confiança a cada dimensão.

${JSON.stringify(draftResult)}

"""
${originalInput.slice(0, 8000)}
"""

${modLines}

Responda APENAS com um JSON válido, sem markdown, com a análise revista completa, no mesmo formato da análise original mas com "confidence" adicionado a cada módulo:
{"overallScore": <média das 5 pontuações revistas, 1 casa decimal>, "overallLevel": "<nível geral>", "summary": "<1 frase curta, máx 25 palavras>", "modules": [{"key": "<key>", "score": <0-4>, "confidence": "<alta|media|baixa>", "finding": "<1 frase, máx 20 palavras>", "evidence": "<referência curta ao texto original, máx 20 palavras, ou \\"Não mencionado no texto fornecido\\">", "recommendation": "<1 frase acionável, máx 20 palavras>"}], "lineItems": ${JSON.stringify(draftResult.lineItems || [])}}

IMPORTANTE SOBRE O IDIOMA: toda a resposta deve ser escrita inteiramente em ${LANG_NAMES_PT[lang]}. Mantenha as keys JSON exatamente como especificado (incluindo os valores de "confidence", que devem ser exatamente "alta", "media" ou "baixa", sem acentos e sem traduzir), apenas o texto narrativo deve estar em ${LANG_NAMES_PT[lang]}.`;
    }

    async function analisar() {
        if (!input.trim()) return;
        if (input.trim().length < 40) { setStatus("error"); setErrorMsg(s.errInputTooShort); return; }
        setStatus("loading"); setErrorMsg(""); setExemploAtivo(null);
        setFullReport(null); setFullReportStatus("idle"); setShowFullReport(false);
        setChangesSaved(false);
        try {
            const system = buildSystemPrompt();
            let conteudoParaAnalise = input;
            if (input.length > ANALISE_CHUNK_SIZE) {
                const partes = dividirEmPartes(input, ANALISE_CHUNK_SIZE);
                setProgresso(s.progressChunking(partes.length));
                const extratos = await Promise.all(partes.map(async (parte, i) => {
                    const prompt = EXTRACTION_SYSTEM.replace("{N}", `${i + 1} de ${partes.length}`);
                    try { return parseAnalysisJson(await chamarWorker(prompt, parte, 1200, accessCode)); }
                    catch { return { notas: "", linhas: [] }; }
                }));
                setProgresso(s.progressSynthesizing);
                conteudoParaAnalise = extratos.map((ex, i) => `--- Excerto ${i + 1}/${extratos.length} ---\nNotas: ${ex.notas || "(sem informação relevante)"}\nLinhas: ${JSON.stringify(ex.linhas || [])}`).join("\n\n");
            }
            const text = await chamarWorker(system, conteudoParaAnalise, 4096, accessCode);
            let parsed;
            try { parsed = parseAnalysisJson(text); }
            catch { throw new Error(s.errInvalidFormat); }
            validateResult(parsed, s);

            // Segunda passagem: revisão crítica independente, que corrige
            // pontuações mal fundamentadas e atribui confiança por dimensão.
            // Se falhar por qualquer razão, mantém-se a análise da primeira
            // passagem sem confiança atribuída — nunca bloqueia o resultado.
            setProgresso(s.progressReviewing);
            try {
                const reviewSystem = buildReviewSystemPrompt(parsed, conteudoParaAnalise);
                const reviewText = await chamarWorker(reviewSystem, "Faz a revisão crítica com base na análise e no texto fornecidos no system prompt.", 4096, accessCode);
                const reviewed = parseAnalysisJson(reviewText);
                validateResult(reviewed, s);
                parsed = reviewed;
            } catch { /* mantém a análise original sem indicador de confiança */ }

            setResult(parsed); setStatus("done");
            guardarHistorico(accessCode, { lang, inputExcerpt: input.slice(0, 400), result: parsed });
        } catch (e) {
            if (e && e.status === 401) {
                setErrorMsg(s.accessCodeInvalid);
                setGateStatus("gate");
            } else if (e && e.status === 429) {
                setErrorMsg(s.errUsageLimit);
            } else {
                setErrorMsg(e instanceof Error && e.message ? e.message : s.errGeneral);
            }
            setStatus("error");
        } finally {
            setProgresso("");
        }
    }

    function baixarRelatorioPdf(report, analysisResult) {
        if (typeof jspdf === "undefined") return;
        const { jsPDF } = jspdf;
        const doc = new jsPDF({ unit: "pt", format: "a4" });
        const margem = 48;
        let y = margem;
        const largura = doc.internal.pageSize.getWidth() - margem * 2;

        function novaLinha(altura) {
            y += altura;
            if (y > doc.internal.pageSize.getHeight() - margem) { doc.addPage(); y = margem; }
        }
        function texto(txt, opts = {}) {
            const tamanho = opts.size || 10;
            const negrito = opts.bold ? "bold" : "normal";
            doc.setFont("helvetica", negrito);
            doc.setFontSize(tamanho);
            if (opts.color) doc.setTextColor(...opts.color); else doc.setTextColor(20, 30, 30);
            const linhas = doc.splitTextToSize(txt, largura);
            linhas.forEach((l) => {
                doc.text(l, margem, y);
                novaLinha((tamanho * 1.3));
            });
        }
        function secaoTitulo(txt) {
            novaLinha(6);
            texto(txt, { bold: true, size: 13, color: [22, 48, 46] });
            novaLinha(2);
        }

        doc.setFillColor(22, 48, 46);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 100, "F");
        doc.setTextColor(246, 243, 237);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(17);
        const tituloLinhas = doc.splitTextToSize(s.fullReportTitle, largura);
        let ty = 36;
        tituloLinhas.forEach((l) => { doc.text(l, margem, ty); ty += 18; });
        doc.setFontSize(11);
        doc.setFont("helvetica", "normal");
        doc.text(`${s.overallLevelLabel}: ${analysisResult.overallLevel}  (${analysisResult.overallScore}/4)`, margem, ty + 8);
        y = 128;

        secaoTitulo(s.fullReportExecSummary);
        texto(report.executiveSummary, { size: 10 });

        secaoTitulo(s.fullReportMethodology);
        texto(report.methodology, { size: 10 });

        secaoTitulo(s.fullReportDimension);
        mods.forEach((mod) => {
            const d = report.dimensionAnalysis.find((r) => r.key === mod.key);
            const m = analysisResult.modules.find((r) => r.key === mod.key);
            if (!d) return;
            texto(`${mod.label}${m ? " — " + levels[m.score] : ""}`, { bold: true, size: 10.5, color: [31, 93, 91] });
            texto(d.narrative, { size: 9.5 });
            novaLinha(4);
        });

        secaoTitulo(s.fullReportSector);
        texto(report.sectorAnalysis && report.sectorAnalysis.trim() ? report.sectorAnalysis : s.fullReportNoSector, { size: 10 });

        if (report.internationalBenchmark && report.internationalBenchmark.trim()) {
            secaoTitulo(s.fullReportBenchmark);
            texto(report.internationalBenchmark, { size: 10 });
        }

        secaoTitulo(s.fullReportRecommendations);
        (report.recommendations || []).forEach((r, i) => {
            texto(`${i + 1}. ${r}`, { size: 10 });
        });

        if (report.roadmap && (report.roadmap.shortTerm.length || report.roadmap.mediumTerm.length || report.roadmap.longTerm.length)) {
            secaoTitulo(s.roadmapTitle);
            const roadmapSections = [
                [s.roadmapShort, report.roadmap.shortTerm],
                [s.roadmapMedium, report.roadmap.mediumTerm],
                [s.roadmapLong, report.roadmap.longTerm],
            ];
            roadmapSections.forEach(([label, items]) => {
                if (!items || items.length === 0) return;
                texto(label, { bold: true, size: 10, color: [31, 93, 91] });
                items.forEach((it) => texto(`• ${it}`, { size: 9.5 }));
                novaLinha(3);
            });
        }

        if (report.organizationActions && report.organizationActions.length > 0) {
            secaoTitulo(s.orgActionsTitle);
            report.organizationActions.forEach((oa) => {
                texto(`${oa.organization} — ${s.orgActionsCurrentLabel}: ${oa.currentMarker}`, { bold: true, size: 10, color: [31, 93, 91] });
                texto(oa.recommendation, { size: 9.5 });
                texto(`${s.orgActionsNextStep}: ${oa.nextStep}`, { size: 9, color: [122, 143, 140] });
                novaLinha(4);
            });
        }

        if (report.annexEvidence && report.annexEvidence.length > 0) {
            secaoTitulo(s.fullReportAnnex);
            report.annexEvidence.forEach((ev) => {
                texto(`${ev.item}: “${ev.quote}”`, { size: 9, color: [122, 143, 140] });
            });
        }

        novaLinha(10);
        texto(s.methodologyDisclaimer, { size: 8, color: [154, 166, 163] });

        doc.save(`relatorio-osg-${lang}.pdf`);
    }

    // Permite corrigir manualmente o marcador G0/G1/G2/G3 atribuído pela IA

    function alterarMarcador(idx, novoMarcador) {
        setResult((prev) => {
            if (!prev || !prev.lineItems) return prev;
            const lineItems = prev.lineItems.map((li, i) => {
                if (i !== idx || li.marker === novoMarcador) return li;
                return {
                    ...li,
                    marker: novoMarcador,
                    manualOverride: true,
                    previousMarker: li.manualOverride ? li.previousMarker : li.marker,
                    overrideTimestamp: new Date().toISOString(),
                };
            });
            return { ...prev, lineItems };
        });
        setChangesSaved(false);
    }
    // Adiciona uma linha orçamental introduzida manualmente pelo utilizador
    // (não vinda da análise da IA) — útil quando a IA não detetou um projeto
    // que o utilizador sabe que existe no orçamento.
    function adicionarLinha(nome, marcador, comentario) {
        if (!nome || !nome.trim()) return;
        setResult((prev) => {
            if (!prev) return prev;
            const novaLinha = { name: nome.trim(), marker: marcador, comment: comentario && comentario.trim() ? comentario.trim() : "", manualEntry: true };
            return { ...prev, lineItems: [...(prev.lineItems || []), novaLinha] };
        });
        setChangesSaved(false);
    }
    function removerLinha(idx) {
        setResult((prev) => {
            if (!prev || !prev.lineItems) return prev;
            return { ...prev, lineItems: prev.lineItems.filter((_, i) => i !== idx) };
        });
        setChangesSaved(false);
    }
